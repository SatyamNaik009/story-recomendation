spring.datasource.url=jdbc:h2:mem:story_tests;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
story.storage.cleanup-enabled=false
story.ai.gemini.api-key=YOUR_GEMINI_API_KEY
story.ai.openai.api-key=YOUR_OPENAI_API_KEY

debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
